[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "patchscope"
version = "0.1.0"
description = "Evidence-grounded patch review agents and bounded harness evolution"
requires-python = ">=3.11"
dependencies = ["langchain>=1,<2", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "pydantic>=2,<3", "scikit-learn>=1.5,<2"]
[project.optional-dependencies]
openai = ["langchain-openai>=1,<2"]
dev = ["pytest>=8,<9"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.scripts]
patchscope = "patchscope.cli:main"
[tool.pytest.ini_options]
testpaths = ["tests"]
